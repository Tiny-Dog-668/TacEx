seed: 42

models:
  separate: True
  policy:
    class: "tacex_tasks.occluded_grasping.vt_aux_heads_policy:OccludedGraspingVTAuxHeadsPolicy"
    clip_actions: False
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: 0.0
    fixed_log_std: False
    reduction: sum
    vision_key: "third_resnet"
    tactile_keys: [
      "tactile_left_rgb_resnet",
      "tactile_right_rgb_resnet",
      "tactile_left_down_rgb_resnet",
      "tactile_right_down_rgb_resnet"
    ]
    proprio_key: "proprio_obs"
    prev_action_key: "prev_action"
    aux_input_key: "aux_head_input"
    aux_reliability_gt_key: "aux_reliability_gt"
    aux_stage_gt_key: "aux_stage_gt"
    aux_stage_onehot_gt_key: "aux_stage_onehot_gt"
    aux_probe_gt_key: "aux_probe_gt"
    aux_grasp_gt_key: "aux_grasp_gt"
    bottom_valid_hist_key: "bottom_valid_hist"
    inner_valid_hist_key: "inner_valid_hist"
    mlp_layers: [512, 256, 128, 64]
    aux_hidden_layers: [256, 128]
    mlp_activation: elu
    aux_reliability_weight: 1.0
    aux_probe_weight: 1.0
    aux_grasp_weight: 1.0
    tactile_pos_enable: True
    tactile_pos_hidden_dim: 64
    tactile_pos_scale: 1.0
    tactile_pair_fusion_enable: True
    tactile_pair_out_dim: 256
    tactile_pair_hidden_layers: [256, 128]
    tactile_probe_keys: ["tactile_left_down_rgb_resnet", "tactile_right_down_rgb_resnet"]
    tactile_grasp_keys: ["tactile_left_rgb_resnet", "tactile_right_rgb_resnet"]
    tactile_gate_hidden_layers: [256, 128]
    alpha_correction_eps: 0.1
  value:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: "concatenate([STATES['critic_can_pos'], STATES['critic_can_quat'], STATES['critic_can_lin_vel'], \
STATES['critic_can_ang_vel'], STATES['critic_gripper_pos'], STATES['critic_gripper_quat'], \
STATES['critic_gripper_lin_vel'], STATES['critic_gripper_ang_vel'], STATES['critic_target_pos'], \
STATES['critic_target_distance']])"
        layers: [512, 256, 128, 64]
        activations: elu
    output: ONE

memory:
  class: RandomMemory
  memory_size: -1

agent:
  class: "tacex_tasks.occluded_grasping.vt_aux_ppo_agent:PPOWithAuxHeadsLoss"
  rollouts: 128
  learning_epochs: 4
  mini_batches: 16
  discount_factor: 0.99
  lambda: 0.95
  learning_rate: 5.0e-04
  learning_rate_scheduler: null
  learning_rate_scheduler_kwargs: null
  state_preprocessor: null
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  clip_predicted_values: True
  entropy_loss_scale: 0.05
  value_loss_scale: 1.0
  kl_threshold: 0.0
  rewards_shaper_scale: 1.0
  time_limit_bootstrap: False
  aux_enable: True
  aux_loss_scale: 1.0
  experiment:
    directory: "occluded_grasping"
    experiment_name: "vt_reliability_stage_box"
    write_interval: 500
    checkpoint_interval: 10000
    wandb: False
    wandb_kwargs: { "sync_tensorboard": True, "project": "occluded_grasping_vision_tactile" }

trainer:
  class: SequentialTrainer
  timesteps: 500000
  environment_info: log
