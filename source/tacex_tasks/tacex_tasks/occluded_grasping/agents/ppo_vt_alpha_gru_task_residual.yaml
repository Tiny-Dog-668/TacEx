seed: 42

models:
  separate: True
  policy:
    class: "tacex_tasks.occluded_grasping.vt_alpha_gru_task_residual_policy:OccludedGraspingVTAlphaGRUTaskResidualPolicy"
    clip_actions: False
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: 0.0
    fixed_log_std: False
    reduction: sum
    vision_key: "third_resnet"
    tactile_inner_keys: [
      "tactile_left_depth_resnet",
      "tactile_right_depth_resnet"
    ]
    tactile_bottom_keys: [
      "tactile_left_down_depth_resnet",
      "tactile_right_down_depth_resnet"
    ]
    proprio_key: "proprio_obs"
    aux_visibility_gt_key: "aux_visibility_gt"
    aux_occlusion_gt_key: "aux_occlusion_gt"
    aux_bottom_contact_gt_key: "aux_bottom_contact_gt"
    aux_bottom_rel_pos_gt_key: "aux_bottom_rel_pos_gt"
    aux_inner_contact_gt_key: "aux_inner_contact_gt"
    aux_inner_contact_diff_gt_key: "aux_inner_contact_diff_gt"
    bottom_tactile_mask_key: "bottom_tactile_current_mask"
    inner_tactile_mask_key: "inner_tactile_current_mask"
    tactile_time_window: 10
    tactile_gru_hidden_dim: 64
    tactile_gru_layers: 2
    tactile_latent_dim: 128
    fused_dim: 256
    task_hidden_dim: 256
    pair_hidden_layers: [128]
    alpha_hidden_dim: 64
    gate_hidden_dim: 64
    base_mlp_layers: [256, 128, 64]
    residual_hidden_layers: [128, 64]
    mlp_activation: elu
    bottom_dx_scale: 0.25
    bottom_dy_scale: 0.12
    inner_gripper_scale: 0.25
    aux_visibility_weight: 1.0
    aux_occlusion_weight: 1.0
    aux_bottom_contact_weight: 1.0
    aux_bottom_rel_pos_weight: 1.0
    aux_inner_contact_weight: 1.0
    aux_inner_contact_diff_weight: 1.0
  value:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: "concatenate([STATES['critic_can_pos'], STATES['critic_can_quat'], STATES['critic_can_lin_vel'], \
STATES['critic_can_ang_vel'], STATES['critic_gripper_pos'], STATES['critic_gripper_quat'], \
STATES['critic_gripper_lin_vel'], STATES['critic_gripper_ang_vel'], STATES['critic_target_pos'], \
STATES['critic_target_distance']])"
        layers: [512, 256, 128, 64]
        activations: elu
    output: ONE

memory:
  class: RandomMemory
  memory_size: -1

agent:
  class: "tacex_tasks.occluded_grasping.vt_aux_ppo_agent:PPOWithAuxHeadsLoss"
  rollouts: 128
  learning_epochs: 4
  mini_batches: 16
  discount_factor: 0.99
  lambda: 0.95
  learning_rate: 5.0e-04
  learning_rate_scheduler: null
  learning_rate_scheduler_kwargs: null
  state_preprocessor: null
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  clip_predicted_values: True
  entropy_loss_scale: 0.05
  value_loss_scale: 1.0
  kl_threshold: 0.0
  rewards_shaper_scale: 1.0
  time_limit_bootstrap: False
  aux_enable: True
  aux_loss_scale: 1.0
  experiment:
    directory: "occluded_grasping"
    experiment_name: "vt_alpha_gru_task_residual_box"
    write_interval: 500
    checkpoint_interval: 10000
    wandb: False
    wandb_kwargs: { "sync_tensorboard": True, "project": "occluded_grasping_vision_tactile" }

trainer:
  class: SequentialTrainer
  timesteps: 500000
  environment_info: log
