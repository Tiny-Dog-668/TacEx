seed: 42


# Models are instantiated using skrl's model instantiator utility
# https://skrl.readthedocs.io/en/latest/api/utils/model_instantiators.html
models:
  separate: False
  policy:  # see gaussian_model parameters
    class: GaussianMixin
    clip_actions: False
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: 0.0
    network:
      - name: wrist_camera_extractor
        input: permute(STATES["wrist_rgb"], (0, 3, 1, 2))  # PyTorch NHWC -> NCHW
        layers:
          - conv2d: {out_channels: 32, kernel_size: 8, stride: 4, padding: 0}
          - conv2d: {out_channels: 64, kernel_size: 4, stride: 2, padding: 0}
          - conv2d: {out_channels: 64, kernel_size: 3, stride: 1, padding: 0}
          - flatten
        activations: relu
      - name: tactile_left_extractor
        input: permute(STATES["tactile_left"], (0, 3, 1, 2))  # PyTorch NHWC -> NCHW
        layers:
          - conv2d: {out_channels: 16, kernel_size: 4, stride: 2, padding: 0}
          - conv2d: {out_channels: 32, kernel_size: 3, stride: 1, padding: 0}
          - flatten
        activations: relu
      - name: tactile_right_extractor
        input: permute(STATES["tactile_right"], (0, 3, 1, 2))  # PyTorch NHWC -> NCHW
        layers:
          - conv2d: {out_channels: 16, kernel_size: 4, stride: 2, padding: 0}
          - conv2d: {out_channels: 32, kernel_size: 3, stride: 1, padding: 0}
          - flatten
        activations: relu
      - name: net
        input: concatenate([wrist_camera_extractor, tactile_left_extractor, tactile_right_extractor, STATES["proprio_obs"]])
        layers: [512, 256, 128]
        activations: elu
    output: ACTIONS
  q_network_1:  # see deterministic_model parameters
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: wrist_camera_extractor
        input: permute(STATES["wrist_rgb"], (0, 3, 1, 2))  # PyTorch NHWC -> NCHW
        layers:
          - conv2d: {out_channels: 32, kernel_size: 8, stride: 4, padding: 0}
          - conv2d: {out_channels: 64, kernel_size: 4, stride: 2, padding: 0}
          - conv2d: {out_channels: 64, kernel_size: 3, stride: 1, padding: 0}
          - flatten
        activations: relu
      - name: tactile_left_extractor
        input: permute(STATES["tactile_left"], (0, 3, 1, 2))  # PyTorch NHWC -> NCHW
        layers:
          - conv2d: {out_channels: 16, kernel_size: 4, stride: 2, padding: 0}
          - conv2d: {out_channels: 32, kernel_size: 3, stride: 1, padding: 0}
          - flatten
        activations: relu
      - name: tactile_right_extractor
        input: permute(STATES["tactile_right"], (0, 3, 1, 2))  # PyTorch NHWC -> NCHW
        layers:
          - conv2d: {out_channels: 16, kernel_size: 4, stride: 2, padding: 0}
          - conv2d: {out_channels: 32, kernel_size: 3, stride: 1, padding: 0}
          - flatten
        activations: relu
      - name: net
        input: concatenate([wrist_camera_extractor, tactile_left_extractor, tactile_right_extractor, STATES["proprio_obs"], ACTIONS])
        layers: [512, 256, 128]
        activations: elu
    output: ONE
  q_network_2:  # see deterministic_model parameters
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: wrist_camera_extractor
        input: permute(STATES["wrist_rgb"], (0, 3, 1, 2))  # PyTorch NHWC -> NCHW
        layers:
          - conv2d: {out_channels: 32, kernel_size: 8, stride: 4, padding: 0}
          - conv2d: {out_channels: 64, kernel_size: 4, stride: 2, padding: 0}
          - conv2d: {out_channels: 64, kernel_size: 3, stride: 1, padding: 0}
          - flatten
        activations: relu
      - name: tactile_left_extractor
        input: permute(STATES["tactile_left"], (0, 3, 1, 2))  # PyTorch NHWC -> NCHW
        layers:
          - conv2d: {out_channels: 16, kernel_size: 4, stride: 2, padding: 0}
          - conv2d: {out_channels: 32, kernel_size: 3, stride: 1, padding: 0}
          - flatten
        activations: relu
      - name: tactile_right_extractor
        input: permute(STATES["tactile_right"], (0, 3, 1, 2))  # PyTorch NHWC -> NCHW
        layers:
          - conv2d: {out_channels: 16, kernel_size: 4, stride: 2, padding: 0}
          - conv2d: {out_channels: 32, kernel_size: 3, stride: 1, padding: 0}
          - flatten
        activations: relu
      - name: net
        input: concatenate([wrist_camera_extractor, tactile_left_extractor, tactile_right_extractor, STATES["proprio_obs"], ACTIONS])
        layers: [512, 256, 128]
        activations: elu
    output: ONE

# Rollout memory
# https://skrl.readthedocs.io/en/latest/api/memories/random.html
memory:
  class: RandomMemory
  memory_size: 1000000


# SAC agent configuration
# https://skrl.readthedocs.io/en/latest/api/agents/sac.html
agent:
  class: SAC
  rollouts: 1
  learning_epochs: 1
  mini_batches: 1
  discount_factor: 0.99
  learning_rate: 3.0e-04
  learning_rate_scheduler: null
  learning_rate_scheduler_kwargs: null
  state_preprocessor: null
  state_preprocessor_kwargs: null
  value_preprocessor: null
  value_preprocessor_kwargs: null
  random_timesteps: 1000
  learning_starts: 1000
  grad_norm_clip: 0.5
  tau: 0.005
  initial_entropy_value: 1.0
  target_entropy: null
  # logging and checkpoint
  experiment:
    directory: "cylinder_grasping"
    experiment_name: "tactile_rgb_sac"
    write_interval: 1000
    checkpoint_interval: 10000
    wandb: False
    wandb_kwargs: {
      "sync_tensorboard": True,
      "project": "cylinder_grasping_tactile"
    }


# Sequential trainer
# https://skrl.readthedocs.io/en/latest/api/trainers/sequential.html
trainer:
  class: SequentialTrainer
  timesteps: 2000000
  environment_info: log
