seed: 42

# Models are instantiated using skrl's model instantiator utility
# https://skrl.readthedocs.io/en/latest/api/utils/model_instantiators.html
models:
  separate: True
  policy:  # see gaussian_model parameters
    class: GaussianMixin
    clip_actions: False
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: 0.0
    network:
      - name: wrist_resnet_identity
        input: STATES["wrist_resnet"]
        layers: []
        activations: []
      - name: tactile_left_resnet
        input: STATES["tactile_left_resnet"]
        layers: []
        activations: []
      - name: tactile_right_resnet
        input: STATES["tactile_right_resnet"]
        layers: []
        activations: []
      - name: net
        input: "concatenate([wrist_resnet_identity, tactile_left_resnet, tactile_right_resnet, STATES['proprio_obs'], STATES['gripper_state'], STATES['action_history']])"
        layers: [512, 256, 128, 64]
        activations: elu
    output: ACTIONS
  value:  # see deterministic_model parameters
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: "concatenate([STATES['proprio_obs'], STATES['gripper_state'], STATES['action_history'], STATES['critic_cube_pos'], \
STATES['critic_cube_quat'], STATES['critic_cube_lin_vel'], STATES['critic_cube_ang_vel'], STATES['critic_gripper_pos'], \
STATES['critic_gripper_quat'], STATES['critic_gripper_lin_vel'], STATES['critic_gripper_ang_vel'], STATES['critic_target_pos'], \
STATES['critic_target_distance']])"
        layers: [512, 256, 128, 64]
        activations: elu
    output: ONE

# Rollout memory
# https://skrl.readthedocs.io/en/latest/api/memories/random.html
memory:
  class: RandomMemory
  memory_size: -1  # automatically determined (same as agent:rollouts)


# PPO agent configuration (field names are from PPO_DEFAULT_CONFIG)
# https://skrl.readthedocs.io/en/latest/api/agents/ppo.html
agent:
  class: PPO
  rollouts: 128
  learning_epochs: 4
  mini_batches: 16
  discount_factor: 0.99
  lambda: 0.95
  learning_rate: 3.0e-04
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.01
    min_lr: 1.0e-06
    max_lr: 5.0e-04
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  clip_predicted_values: True
  entropy_loss_scale: 0.01
  value_loss_scale: 1.0
  kl_threshold: 0.0
  rewards_shaper_scale: 1.0
  time_limit_bootstrap: False
  # logging and checkpoint
  experiment:
    directory: "cube_grasping"
    experiment_name: "vision_tactile_fusion"
    write_interval: 500
    checkpoint_interval: 10000
    wandb: False             # whether to use Weights & Biases
    wandb_kwargs: {
      "sync_tensorboard": True,
      "project": "cube_grasping_vision_tactile"
    }


# Sequential trainer
# https://skrl.readthedocs.io/en/latest/api/trainers/sequential.html
trainer:
  class: SequentialTrainer
  timesteps: 200000
  environment_info: log
